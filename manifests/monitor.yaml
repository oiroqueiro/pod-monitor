# # -------------------------------------------------------------------------
# TEMPLATE: monitor.yaml (100% Hardened Local)
# # -------------------------------------------------------------------------
apiVersion: v1
kind: Pod
metadata:
  name: ${PROJECT_NAME}
spec:
  securityContext:
    supplementalGroups:
      - ${GID_ADM}
      - ${GID_JOURNAL}
  containers:
    # 1. Sensor del Sistema Operativo (Distroless Local)
    - name: sensor-so
      image: ${REGISTRY_PREFIX}/monitor-node-exporter:${IMAGE_TAG}
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      ports:
        - containerPort: 9100
          hostPort: ${PORT_NODE_EXPORTER}
      volumeMounts:
        - name: proc
          mountPath: /host/proc
          readOnly: true
        - name: sys
          mountPath: /host/sys
          readOnly: true

    # 2. Sensor de Podman (Distroless Local)
    - name: sensor-podman
      image: ${REGISTRY_PREFIX}/monitor-podman-exporter:${IMAGE_TAG}
      securityContext:
        runAsUser: 0  # En rootless, el UID 0 interno equivale a tu usuario externo (puede leer el socket)
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      env:
        - name: CONTAINER_HOST
          value: unix:///run/podman/podman.sock
      ports:
        - containerPort: 9882
          hostPort: ${PORT_PODMAN_EXPORTER}
      volumeMounts:
        - name: podman-sock
          mountPath: /run/podman/podman.sock
          readOnly: true
        - name: dot-config
          mountPath: /.config

    # 3. Recolector de Logs Promtail (Hardened Local)
    - name: promtail
      image: docker.io/grafana/promtail:3.5.8
      securityContext:
        runAsUser: 0
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      command:
        - "/usr/bin/promtail"
        - "-config.file=/etc/promtail/config.yml"
      volumeMounts:
        - name: promtail-config
          mountPath: /etc/promtail/config.yml
          readOnly: true
        - name: journal
          mountPath: /host/run/log/journal
          readOnly: true
        - name: var-log
          mountPath: /host/var/log
          readOnly: true
        - name: machine-id
          mountPath: /etc/machine-id
          readOnly: true
        - name: promtail-positions
          mountPath: /tmp
          readOnly: false

  volumes:
    - name: proc
      hostPath:
        path: /proc
    - name: sys
      hostPath:
        path: /sys
    - name: podman-sock
      hostPath:
        path: ${PODMAN_SOCK}
    - name: dot-config
      emptyDir: {}
    - name: promtail-config
      hostPath:
        path: ${PROJECT_DIR}/config/promtail.generated.yml
    - name: journal
      hostPath:
        path: ${JOURNAL_PATH}
    - name: var-log
      hostPath:
        path: /var/log
    - name: machine-id
      hostPath:
        path: /etc/machine-id
    - name: promtail-positions
      emptyDir: {}