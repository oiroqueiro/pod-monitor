services:
  # --- CEREBRO & VISUALIZACIÓN ---
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    user: "root"
    volumes:
      # Configuración (coincide con tu carpeta prometheus/)
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      # Datos (coincide con tu carpeta data/prometheus)
      - ./data/prometheus:/prometheus
      - /var/run/docker.sock:/var/run/docker.sock:ro  # <-- AÑADE ESTO
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      # Habilita la recepción de métricas externas (Remote Write)
      - '--web.enable-remote-write-receiver'
      # Opcional: permite recargar la config vía HTTP POST sin reiniciar
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - monitoring
    labels:
      prometheus.enable: "true"
      prometheus.port: "9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    user: "0" # Necesario para escribir en ./data sin problemas de permisos
    volumes:
      # Datos (coincide con tu carpeta data/grafana)
      - ./data/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - monitoring
    labels:
      prometheus.enable: "true"
      prometheus.port: "3000"
      prometheus.path: "/metrics"

  # --- LOGS (LOKI + PROMTAIL) ---
  loki:
    image: grafana/loki:latest
    container_name: loki
    user: "0"
    volumes:
       # Datos (coincide con tu carpeta data/loki)
      - ./data/loki:/loki
      # Configuración (coincide con tu archivo loki/loki.yml)
      - ./loki/loki.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    restart: unless-stopped
    networks:
      - monitoring

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    user: "0:0"
    volumes:
      # Configuración (coincide con tu archivo promtail/promtail.yml)
      - ./promtail/promtail.yml:/etc/promtail/config.yml
      # Lectura del Sistema (Inevitable leer del host)
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock  # <--- NECESARIO para que lea los nombres
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    networks:
      - monitoring

  # --- AGENTES ---
  node_exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: node_exporter
    hostname: oci-ampere
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    pid: host
    restart: unless-stopped
    volumes:
      - '/:/host:ro,rslave'
    networks:
      - monitoring

  # ----- Sustituye a cAdvisor -----
  netdata:
    image: netdata/netdata:latest
    container_name: netdata
    pid: host
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    ports:
      - "19999:19999"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
    networks:
      - monitoring
      - nginx-proxy-manager_default

networks:
  monitoring:
    name: monitoring
    driver: bridge
  nginx-proxy-manager_default:
    external: true
